name: flight-watch

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run flight search
        env:
          DUFFEL_API_KEY: ${{ secrets.DUFFEL_API_KEY }}
        run: python search.py
